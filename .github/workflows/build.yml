name: Compilar libro
on:
  push:
  workflow_dispatch:
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: 'biber'
          pre_compile: 'lualatex -interaction=nonstopmode -halt-on-error -output-directory=assets assets/wing.tex'
      - uses: actions/upload-artifact@v4
        with:
          name: avia-libro-pdf
          path: main.pdf
