name: Compilar libro
on:
  push:
    branches: [main]
    paths-ignore:
      - 'main.pdf'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compilar-libro
  cancel-in-progress: true
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el manuscrito
        uses: actions/checkout@v4
      - name: Compilar PDF con LuaLaTeX y Biber
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_lualatex: true
          extra_system_packages: biber
          pre_compile: 'cd assets && lualatex -interaction=nonstopmode -halt-on-error wing.tex && cd ..'
      - name: Guardar el libro como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: avia-editorial-pdf
          path: main.pdf
          if-no-files-found: error
      - name: Actualizar main.pdf en el repo
        run: |
          git config user.name "Avia Editorial"
          git config user.email "actions@users.noreply.github.com"
          git add -f main.pdf
          git diff --cached --quiet && { echo "PDF sin cambios"; exit 0; }
          git commit -m "PDF compilado de ${GITHUB_SHA::7} [skip ci]"
          git push
