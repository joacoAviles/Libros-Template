name: Compilar y validar Avia 2.2
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editorial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEX_IMAGE: ghcr.io/xu-cheng/texlive-full@sha256:556e2e2caa7d489ce155de0eb3f43e324e6502ed4e9871aa400662b156cf00ad
      AVIA_JOBS: '4'
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verificar preservacion de entradas y limpieza
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Preparar casos desde cero
        run: python3 scripts/build.py --tests --prepare-only
      - name: Descargar entorno TeX fijado
        run: docker pull "$TEX_IMAGE"
      - name: Compilar sin red ni shell escape
        run: |
          docker run --rm --network none --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TEXMFVAR=/tmp/texmf-var -e TEXMFCONFIG=/tmp/texmf-config \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e FORCE_SOURCE_DATE=1 -e AVIA_JOBS \
            -v "$PWD:/work" -w /work --entrypoint /bin/bash \
            "$TEX_IMAGE" scripts/compile.sh
      - name: Instalar auditor PDF
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-qa.txt
      - name: Auditar registros, contenido y geometria
        run: .venv/bin/python scripts/qa.py
      - name: Publicar exclusivamente el PDF aprobado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: avia-editorial-2.2-aprobado
          path: .build/approved/
          include-hidden-files: true
          if-no-files-found: error
      - name: Conservar diagnosticos incluso si hay fallos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: avia-editorial-2.2-diagnosticos
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .build/qa.json
            .build/qa.md
            .build/manifest.json
            .build/environment.txt
            .build/cases/*/compile.txt
            .build/cases/*/main.log
            .build/cases/*/main.blg
            .build/cases/*/exit-code.txt
